# inventory/hosts.yaml
---
# ============================================================
# 生产环境核心路由器 - SSH 可达，同时保留 OOB 应急通道
# ============================================================
H3C-SR88-01:
  hostname: 172.12.1.11                      # 【必填】SSH 业务管理 IP
  groups:
    - h3c_sr88_comware_v7_r7171
  connection_options:
    # ---- OOB（Console 映射 Telnet） ----
    netmiko_oob:
      hostname: 127.0.0.1           # 【必填】串口服务器 IP（固定）
      port: 30001                          # 【必填】该设备对应的 Telnet 端口
    # ---- NETCONF（如果需要覆盖默认值） ----
    ncclient:
      port: 830                           # 【选填】默认 830，通常无需修改
      extras:
        timeout: 60                       # 【选填】可覆盖 Group 中的值
  data:
    location: "IDC-A"
    role: core_router
    mgmt_interface: GigabitEthernet0/0/0

